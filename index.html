<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:system-ui,sans-serif;
}

body{
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:rgba(0,0,0,.85);
    backdrop-filter:blur(10px);
}

.dialog{
    width:340px;
    background:#111;
    border-radius:24px;
    overflow:hidden;
    box-shadow:0 20px 60px rgba(0,0,0,.6);
    animation:show .3s ease;
}

.banner{
    height:190px;
    background:url('https://raw.githubusercontent.com/rajrachit086-code/Web/refs/heads/main/20260531_155902.jpg') center/cover;
    position:relative;
}

.banner::after{
    content:"";
    position:absolute;
    inset:0;
    background:linear-gradient(
        transparent,
        rgba(17,17,17,.95)
    );
}

.content{
    padding:20px;
    color:#fff;
}

.badge{
    display:inline-block;
    padding:5px 10px;
    border-radius:999px;
    background:#6a00ff;
    font-size:12px;
    font-weight:600;
    margin-bottom:12px;
}

.title{
    font-size:24px;
    font-weight:800;
    margin-bottom:8px;
}

.desc{
    color:#bdbdbd;
    font-size:14px;
    line-height:1.5;
    margin-bottom:20px;
}

.btn{
    width:100%;
    height:50px;
    border:none;
    border-radius:14px;
    font-size:16px;
    font-weight:700;
    cursor:pointer;
}

.watch{
    background:#6a00ff;
    color:#fff;
}

.close{
    margin-top:10px;
    background:#222;
    color:#ddd;
}

.btn:active{
    transform:scale(.98);
}

@keyframes show{
    from{
        opacity:0;
        transform:translateY(30px);
    }
    to{
        opacity:1;
        transform:translateY(0);
    }
}
</style>
</head>
<body>

<div class="dialog">

    <div class="banner"></div>

    <div class="content">

        <div class="badge">PREMIUM</div>

        <div class="title">
            RAJRACHIT VIP
        </div>

        <div class="desc">
            Unlock exclusive content, premium tools,
            and private updates available only for VIP members.
        </div>

        <button class="btn watch"
        onclick="openVip()">
            Join Now
        </button>

        <button class="btn close"
        onclick="closeDialog()">
            Maybe Later
        </button>

    </div>

</div>

<script>
function openVip(){
    window.open(
      "https://t.me/rajrachit518",
      "_blank"
    );
}

function closeDialog(){
    window.location.href="action://close";
}
</script>

</body>
  </html>
